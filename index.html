<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD 演示</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; color: #17243b; font: 16px/1.7 system-ui, sans-serif; }
    main { width: min(520px, 80vw); padding: 48px; background: white; border-radius: 20px; box-shadow: 0 16px 50px #17243b14; }
    h1 { margin: 0 0 12px; font-size: 2rem; } p { margin: 0; color: #52617a; }
    .status { display: inline-block; margin-bottom: 18px; color: #167b55; background: #e5f6ed; padding: 4px 12px; border-radius: 99px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <span class="status">自动部署成功</span>
    <h1>你好，CI/CD！</h1>
    <p>这个网页经过自动检查、构建，并由 GitHub Actions 发布。</p>
  </main>
</body>
</html>
